name: Build Windows x64
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'tests/**', 'third_party/**', 'VERSION', 'CMakeLists.txt', 'scripts/**', '.github/workflows/windows.yml']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile, test and package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarOrder-win11-x64
          path: dist/TaskbarOrder-*-win11-x64.zip
          if-no-files-found: error
